<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Patient Portal</title>
    <link rel="stylesheet" href="../admin/styles.css">
</head>

<body>
    <div class="dashboard">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
                        <circle cx="30" cy="30" r="28" fill="#F59E0B" />
                        <path d="M30 15 L30 45 M15 30 L45 30" stroke="white" stroke-width="4" stroke-linecap="round" />
                    </svg>
                </div>
                <h2>Patient Panel</h2>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="search.html">
                        <span class="icon">🔍</span>
                        <span>Find a Doctor</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="appointments.html">
                        <span class="icon">📅</span>
                        <span>My Appointments</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="profile.html">
                        <span class="icon">👤</span>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <h1>My Profile</h1>
                <div class="user-info">
                    <span id="patientName">Patient</span>
                </div>
            </header>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2>Personal Information</h2>
                    </div>
                    <div class="card-body">
                        <div id="profileInfo">
                            <p>Loading profile...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        const token = localStorage.getItem('patientToken');
        const patientData = JSON.parse(localStorage.getItem('patientData') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        if (patientData.name) {
            document.getElementById('patientName').textContent = patientData.name;
        }

        async function loadProfile() {
            const profileDiv = document.getElementById('profileInfo');
            try {
                // If we have the ID, fetch fresh data, otherwise use localStorage data
                if (patientData.id) {
                    const response = await fetch(`${API_BASE_URL}/patients/${patientData.id}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const patient = await response.json();
                        renderProfile(patient);
                    } else {
                        renderProfile(patientData); // Fallback
                    }
                } else {
                    renderProfile(patientData);
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                renderProfile(patientData);
            }
        }

        function renderProfile(patient) {
            const profileDiv = document.getElementById('profileInfo');
            profileDiv.innerHTML = `
                <div class="form-row">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" value="${patient.name || ''}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" value="${patient.email || ''}" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" value="${patient.phone || ''}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" value="${patient.address || ''}" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="text" value="${patient.dateOfBirth || ''}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <input type="text" value="${patient.gender || ''}" readonly>
                    </div>
                </div>
            `;
        }

        function logout() {
            localStorage.removeItem('patientToken');
            localStorage.removeItem('patientData');
            window.location.href = 'login.html';
        }

        loadProfile();
    </script>
</body>

</html>
