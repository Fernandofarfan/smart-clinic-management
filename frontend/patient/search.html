<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Doctor - Patient Portal</title>
    <link rel="stylesheet" href="../admin/styles.css">
</head>

<body>
    <div class="dashboard">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
                        <circle cx="30" cy="30" r="28" fill="#F59E0B" />
                        <path d="M30 15 L30 45 M15 30 L45 30" stroke="white" stroke-width="4" stroke-linecap="round" />
                    </svg>
                </div>
                <h2>Patient Panel</h2>
            </div>

            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="search.html">
                        <span class="icon">🔍</span>
                        <span>Find a Doctor</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="appointments.html">
                        <span class="icon">📅</span>
                        <span>My Appointments</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="profile.html">
                        <span class="icon">👤</span>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <h1>Find a Doctor</h1>
                <div class="user-info">
                    <span id="patientName">Patient</span>
                </div>
            </header>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2>Search Doctors</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="searchName">Search by Name</label>
                                <input type="text" id="searchName" placeholder="Enter doctor name">
                            </div>
                            <div class="form-group">
                                <label for="searchSpecialty">Filter by Specialty</label>
                                <select id="searchSpecialty">
                                    <option value="">All Specialties</option>
                                    <option value="Cardiology">Cardiology</option>
                                    <option value="Pediatrics">Pediatrics</option>
                                    <option value="Orthopedics">Orthopedics</option>
                                    <option value="Dermatology">Dermatology</option>
                                    <option value="Neurology">Neurology</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="searchDoctors()" class="btn-primary">🔍 Search</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Search Results</h2>
                    </div>
                    <div class="card-body">
                        <div id="searchResults" class="doctors-grid">
                            <p>Enter a doctor name to search</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        const token = localStorage.getItem('patientToken');
        const patientData = JSON.parse(localStorage.getItem('patientData') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        if (patientData.name) {
            document.getElementById('patientName').textContent = patientData.name;
        }

        async function searchDoctors() {
            const searchName = document.getElementById('searchName').value;
            const searchSpecialty = document.getElementById('searchSpecialty').value;
            const resultsDiv = document.getElementById('searchResults');

            resultsDiv.innerHTML = '<p>Searching...</p>';

            try {
                let url = `${API_BASE_URL}/doctors`;

                if (searchName) {
                    url = `${API_BASE_URL}/doctors/search?name=${encodeURIComponent(searchName)}`;
                } else if (searchSpecialty) {
                    url = `${API_BASE_URL}/doctors/specialty/${encodeURIComponent(searchSpecialty)}`;
                }

                const response = await fetch(url);
                const doctors = await response.json();

                if (doctors.length === 0) {
                    resultsDiv.innerHTML = '<p>No doctors found</p>';
                    return;
                }

                resultsDiv.innerHTML = doctors.map(doctor => `
                    <div class="doctor-card">
                        <h3>${doctor.name}</h3>
                        <div class="specialty">${doctor.specialty}</div>
                        <div class="info">📧 ${doctor.email}</div>
                        <div class="info">📞 ${doctor.phone}</div>
                        <div class="info">💰 $${doctor.consultationFee || 'N/A'}</div>
                        ${doctor.bio ? `<p style="margin-top: 8px; font-size: 13px; color: var(--text-secondary);">${doctor.bio}</p>` : ''}
                        <button onclick="bookAppointment(${doctor.id}, '${doctor.name}')" class="btn-primary" style="margin-top: 12px; width: 100%;">Book Appointment</button>
                    </div>
                `).join('');
            } catch (error) {
                resultsDiv.innerHTML = '<p>Error searching doctors</p>';
            }
        }

        async function bookAppointment(doctorId, doctorName) {
            const dateStr = prompt(`Book appointment with ${doctorName}\nEnter date and time (YYYY-MM-DDTHH:mm):`, new Date().toISOString().slice(0, 16));
            
            if (!dateStr) return;

            try {
                const response = await fetch(`${API_BASE_URL}/appointments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        doctorId: doctorId,
                        patientId: patientData.id,
                        appointmentTime: dateStr,
                        symptoms: 'Booked via portal',
                        notes: ''
                    })
                });

                if (response.ok) {
                    alert('Appointment booked successfully!');
                } else {
                    const data = await response.json();
                    alert('Failed to book: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error booking:', error);
                alert('Error booking appointment');
            }
        }

        function logout() {
            localStorage.removeItem('patientToken');
            localStorage.removeItem('patientData');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
