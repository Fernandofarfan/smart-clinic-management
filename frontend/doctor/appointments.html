<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Doctor Portal</title>
    <link rel="stylesheet" href="../admin/styles.css">
    <style>
        .appointments-table {
            width: 100%;
            border-collapse: collapse;
        }

        .appointments-table th,
        .appointments-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .appointments-table th {
            background: var(--bg-light);
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-scheduled {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .status-completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-cancelled {
            background: #FEE2E2;
            color: #991B1B;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
                        <circle cx="30" cy="30" r="28" fill="#10B981" />
                        <path d="M30 15 L30 45 M15 30 L45 30" stroke="white" stroke-width="4" stroke-linecap="round" />
                    </svg>
                </div>
                <h2>Doctor Panel</h2>
            </div>

            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="#appointments">
                        <span class="icon">📅</span>
                        <span>My Appointments</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#prescriptions">
                        <span class="icon">💊</span>
                        <span>Prescriptions</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#profile">
                        <span class="icon">👤</span>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <h1>My Appointments</h1>
                <div class="user-info">
                    <span id="doctorName">Dr. John Smith</span>
                </div>
            </header>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2>Patient Appointments</h2>
                        <button onclick="loadAppointments()" class="btn-secondary">🔄 Refresh</button>
                    </div>
                    <div class="card-body">
                        <table class="appointments-table">
                            <thead>
                                <tr>
                                    <th>Date & Time</th>
                                    <th>Patient Name</th>
                                    <th>Symptoms</th>
                                    <th>Status</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody id="appointmentsTableBody">
                                <tr>
                                    <td colspan="5" style="text-align: center;">Loading appointments...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        const token = localStorage.getItem('doctorToken');
        const doctorData = JSON.parse(localStorage.getItem('doctorData') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        if (doctorData.name) {
            document.getElementById('doctorName').textContent = doctorData.name;
        }

        loadAppointments();

        async function loadAppointments() {
            const tbody = document.getElementById('appointmentsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Loading...</td></tr>';

            try {
                const response = await fetch(`${API_BASE_URL}/appointments/doctor/${doctorData.id}`);
                const appointments = await response.json();

                if (appointments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No appointments found</td></tr>';
                    return;
                }

                tbody.innerHTML = appointments.map(apt => `
                    <tr>
                        <td>${new Date(apt.appointmentTime).toLocaleString()}</td>
                        <td>${apt.patient?.name || 'N/A'}</td>
                        <td>${apt.symptoms || 'N/A'}</td>
                        <td><span class="status-badge status-${apt.status.toLowerCase()}">${apt.status}</span></td>
                        <td>${apt.notes || '-'}</td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Error loading appointments</td></tr>';
            }
        }

        function logout() {
            localStorage.removeItem('doctorToken');
            localStorage.removeItem('doctorData');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
