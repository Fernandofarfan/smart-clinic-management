<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions - Doctor Portal</title>
    <link rel="stylesheet" href="../admin/styles.css">
</head>

<body>
    <div class="dashboard">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
                        <circle cx="30" cy="30" r="28" fill="#10B981" />
                        <path d="M30 15 L30 45 M15 30 L45 30" stroke="white" stroke-width="4" stroke-linecap="round" />
                    </svg>
                </div>
                <h2>Doctor Panel</h2>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="appointments.html">
                        <span class="icon">📅</span>
                        <span>My Appointments</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="prescriptions.html">
                        <span class="icon">💊</span>
                        <span>Prescriptions</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="profile.html">
                        <span class="icon">👤</span>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <h1>Prescriptions</h1>
                <div class="user-info">
                    <span id="doctorName">Doctor</span>
                </div>
            </header>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2>Manage Prescriptions</h2>
                    </div>
                    <div class="card-body">
                        <p>Prescription management functionality coming soon...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('doctorToken');
        const doctorData = JSON.parse(localStorage.getItem('doctorData') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        if (doctorData.name) {
            document.getElementById('doctorName').textContent = doctorData.name;
        }

        function logout() {
            localStorage.removeItem('doctorToken');
            localStorage.removeItem('doctorData');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
