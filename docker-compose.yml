version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/smart_clinic_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=2306
      - APP_FILE_STORAGE_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart-clinic-network

  frontend:
    build: 
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8082/api
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - smart-clinic-network

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=2306
      - MYSQL_DATABASE=smart_clinic_db
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
      # - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - smart-clinic-network

volumes:
  db_data:

networks:
  smart-clinic-network:
    driver: bridge
