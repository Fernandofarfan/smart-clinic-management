name: Enterprise CI/CD & Quality Gate

on:
  push:
    branches: [ "main", "master", "appmod/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Backend Validation (Java/Spring Boot)
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Verify Code Style & Compile
      run: mvn clean compile -DskipTests
      
    - name: Run Unit & Integration Tests
      run: mvn test
      
    # Optional: Upload Test Report
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: java-test-report
        path: backend/target/surefire-reports

  # 2. Frontend Validation (React/Vite)
  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-react

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend-react/package-lock.json
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Lint Code (Static Analysis)
      run: npm run lint --if-present
      
    - name: Build Production Bundle
      run: npm run build

  # 3. Security Scanning (CodeQL)
  security-scan:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
